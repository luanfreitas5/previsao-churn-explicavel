# =============================================================================
# .pre-commit-config.yaml — apenas verificações RÁPIDAS, para não criar atrito no
# commit. Checagens pesadas (basedPyright, bandit, vulture, refurb, xenon,
# interrogate, pip-audit, suíte completa) rodam no CI e em `make check`.
#
# Setup:
#   uv run pre-commit install --hook-type pre-commit --hook-type commit-msg
#   uv run detect-secrets scan > .secrets.baseline
#   uv run pre-commit autoupdate          # reatualiza os `rev` fixados abaixo
# =============================================================================

default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1000]   # bloqueia commit de dados/modelos grandes
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.16.5
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: pytest-smoke
        name: pytest (smoke)
        entry: uv run pytest -m smoke -q --no-cov
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-commit]
