# =============================================================================
# pyproject.toml — fonte única de verdade para dependências e configuração de
# ferramentas. Alinhado ao CLAUDE.md (Data Science Projects).
# Gerenciador recomendado: uv. Lock file (uv.lock) DEVE ser commitado.
# =============================================================================

[project]
name = "previsao-churn-explicavel"
version = "0.6.0"
description = "Previsão de churn (não recompra) de clientes Olist com RFM, LightGBM e explicabilidade via SHAP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Luan Freitas", email = "luan.mgf@gmail.com" }]
keywords = ["churn", "shap", "lightgbm", "rfm", "explainable-ai", "olist"]
classifiers = [ # https://pypi.org/classifiers/
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Environment :: GPU :: NVIDIA CUDA :: 12",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: Microsoft :: Windows :: Windows 11",
]

# --- Dependências de runtime (instale apenas o que o projeto precisar) -------
dependencies = [
    # Manipulação de dados (preferência: polars lazy) + storage colunar
    "polars>=1.0",
    "pyarrow>=16.0",
    "numpy>=1.26",
    "pandas>=2.2",
    # Contratos de dados
    "pandera[polars]>=0.20",
    # Configuração e validação em runtime
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # Progresso e logging
    "rich>=13.7",
    # Visualização
    "seaborn>=0.13",
    "matplotlib>=3.9",
    # Modelagem
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    # Explicabilidade (núcleo do projeto)
    "shap>=0.48.0",
    # Auditoria de justiça (disparidade por UF do cliente)
    "fairlearn>=0.10",
    # Rastreamento de experimentos
    "mlflow>=2.14",
    # Persistência de modelos
    "joblib>=1.4",
]

[tool.uv]
# Grupos instalados por padrão: `uv sync --dev` no CI continua trazendo tudo;
# imagens Docker usam `--no-default-groups` (só runtime).
default-groups = ["dev", "quality", "docs"]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# Restrições em dependências transitivas por segurança (pip-audit) e build.
# gitpython < 3.1.51 (puxado pelo mlflow) tem 2 CVEs corrigidos na 3.1.51:
# GHSA-2f96-g7mh-g2hx e GHSA-v396-v7q4-x2qj.
# numba < 0.61 (puxado pelo shap) não declara requires-python compatível com
# Python 3.11+ nos metadados, mas falha o build em tempo de setup.py nessas
# versões — forçamos um piso que já publica wheels para cp310-cp314.
constraint-dependencies = ["gitpython>=3.1.51", "numba>=0.61"]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }
torchaudio = { index = "pytorch-cu129" }

# --- Extras opcionais (ative por projeto: uv sync --extra name, etc.) -------
[project.optional-dependencies]
# Dashboard interativo de explicabilidade (Streamlit + Plotly)
app = [
    "streamlit>=1.59.2",
    "plotly>=6.9.0",
]


# --- Grupos de dependências (PEP 735): dev + quality (CI) + docs + profiling --
[dependency-groups]
dev = [
    # Lint + format
    "ruff>=0.5",                    # Linter e formatador extremamente rápido - substitui flake8/isort/black
    # Type checking (roda no CI e em `make check`, não no pre-commit)
    "basedpyright>=1.13",           # Type checker estático baseado no Pyright - substitui mypy
    # Testes
    "pytest>=8.2",                  # Framework de testes
    "pytest-cov>=5.0",              # Cobertura de código
    "hypothesis>=6.100",            # Testes property-based
    # Workflow
    "pre-commit>=3.7",              # Hooks de commit (apenas checagens rápidas)
    "commitizen>=4.16.5",           # Conventional Commits + SemVer + CHANGELOG
    "detect-secrets>=1.5",          # Detector de segredos (hook + baseline)
    # Notebooks
    "nbqa>=1.8",                    # Aplica linters a notebooks
    "nbstripout>=0.7",              # Remove outputs dos notebooks antes do commit
    "ipykernel>=7.3.0",             # Kernel do Jupyter (Data Wrangler no VSCode)
    "ipywidgets>=8.1.8",            # Widgets interativos do Jupyter
    "pip>=26.1.2",                  # Necessário para o Data Wrangler no VSCode
]
quality = [
    # Checagens pesadas: rodam no CI e em `make check`
    "bandit[toml]>=1.7",            # Análise de segurança do código
    "pip-audit>=2.7",               # Auditoria de vulnerabilidades das dependências
    "vulture>=2.11",                # Código morto
    "refurb>=2.0",                  # Sugestões de modernização
    "xenon>=0.9",                   # Limites de complexidade (falha o CI se excedidos)
    "radon>=6.0",                   # Métricas de complexidade
    "interrogate>=1.7",             # Cobertura de docstrings
]
docs = [
    "mkdocs-material>=9.7.7",       # Tema do MkDocs
    "mkdocstrings[python]>=0.25",   # API reference gerada das docstrings
]
profiling = [
    "scalene>=1.5",                 # Profiler de CPU + memória (use sob demanda)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
Homepage = "https://github.com/luanfreitas5/previsao-churn-explicavel"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
churn = "src.main:main"


# =============================================================================
# RUFF — lint + format (substitui flake8/isort/black)
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (organização de imports)
    "N",      # pep8-naming
    "UP",     # pyupgrade (sintaxe moderna)
    "B",      # flake8-bugbear (bugs comuns e más práticas)
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "RET",    # flake8-return
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib (usar Path em vez de os.path)
    "PD",     # pandas-vet — antipadrões específicos de pandas
    "NPY",    # NumPy-specific rules
    "PERF",   # perflint — antipadrões de performance
    "RUF",    # regras específicas do próprio Ruff
    "PL",     # pylint (subconjunto)
    "TRY",    # tryceratops — boas práticas de exception handling
]
ignore = [
    "PLR0913", # muitos argumentos em função — comum em pipelines de ML
    "PLR2004", # "magic value" em comparação — comum em thresholds de modelo
    "TRY003",  # mensagem longa em exceção customizada
    "PLR0917", # muitos parâmetros em função — comum em pipelines de ML
    "PLC0415", # import fora do topo — usado em testes para isolar imports
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"  # docstrings no formato NumPy

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "PLR2004"]        # fixtures e valores fixos em testes
"notebooks/*" = ["E402", "F401"]      # imports fora de ordem/não usados em notebooks

[tool.ruff.format]
docstring-code-format = true

# =============================================================================
# BASEDPYRIGHT — type checking estático (roda no CI)
# =============================================================================
[tool.basedpyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"
include = ["src"]
exclude = ["**/__pycache__", "notebooks", "data", "models"]
reportMissingTypeStubs = false

# =============================================================================
# BANDIT — análise de segurança (roda no CI)
# =============================================================================
[tool.bandit]
exclude_dirs = ["tests", "notebooks", ".venv"]

# =============================================================================
# VULTURE — detecção de código morto
# =============================================================================
[tool.vulture]
min_confidence = 80
paths = ["src"]
exclude = ["notebooks/"]

# =============================================================================
# REFURB — sugestões de modernização
# =============================================================================
[tool.refurb]
# Códigos ignorados: ajuste conforme o estilo do projeto
ignore = [
    "FURB105",  # print() sem parênteses vazios — inofensivo, pode ignorar
    "FURB126",  # return implícito — às vezes reduz clareza em funções longas
]

# =============================================================================
# PYTEST — testes (unit, integração, property-based, comportamentais)
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
markers = [
    "smoke: testes rápidos (< 10 s) usados no pre-commit",
    "integration: testes de pipeline ponta a ponta",
    "ml: testes comportamentais / de regressão de métrica",
    "slow: testes lentos (pulados por padrão localmente)",
]

# =============================================================================
# COVERAGE — meta de cobertura ≥ 80%
# =============================================================================
[tool.coverage.run]
source = ["src"]
branch = true
omit = ["src/main.py", "*/__init__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

# =============================================================================
# INTERROGATE — cobertura de docstrings
# =============================================================================
[tool.interrogate]
fail-under = 80
ignore-init-method = true
ignore-magic = true
exclude = ["tests", "notebooks", "docs"]

# =============================================================================
# COMMITIZEN — Conventional Commits + SemVer + CHANGELOG
# =============================================================================
[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"   # lê [project].version
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true
