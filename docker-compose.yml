# =============================================================================
# docker-compose.yml — dashboard Streamlit + servidor MLflow local (SQLite).
# Validar com: docker compose config -q
# =============================================================================
services:
  dashboard:
    build: .
    image: churn-dashboard:${DASHBOARD_VERSION:-dev}
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      # Modelo e camada gold ficam fora da imagem (gerados pela pipeline no host).
      - ./models:/app/models:ro
      - ./data/gold:/app/data/gold:ro
    ports:
      - "127.0.0.1:8501:8501" # só na máquina local
    read_only: true # sistema de arquivos imutável; escrita só no /tmp em memória
    tmpfs:
      - /tmp
    restart: unless-stopped

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --artifacts-destination=/mlflow/artifacts
      - --serve-artifacts
      # MLflow >= 3.5 valida o Host: sem isto a API recebe 403 ao ser chamada por `mlflow:5000`
      - --allowed-hosts=mlflow:5000,localhost:5000
    volumes:
      - mlflow_data:/mlflow
    ports:
      - "127.0.0.1:5000:5000" # sem autenticação: nunca expor em 0.0.0.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  mlflow_data:
